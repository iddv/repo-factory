# .github/repo-factory.yml — how this repository is maintained. Read by repo-factory on every poll;
# followed by any agent that reads AGENTS.md. Change it in a PR like any other file.
# repo-factory writes nothing on any issue: it fixes only the issues its owner labelled `go`,
# each as a pull request, and only while maintenance is switched on for this repository.
repo-factory: {{repo_factory}}                      # schema version

status: {{status}}            # maintained | as-is | archived
                              # as-is or archived: nothing is fixed; the issues are only listed.

triage:                       # not used by this version (kept for older readers)
  enabled: {{triage_enabled}}
  close_duplicates: {{triage_close_duplicates}}
  answer_questions: {{triage_answer_questions}}

revise:
  trigger: {{revise_trigger}}                 # go (or owner): fix issues the owner labelled go | off: fix nothing
  auto_go: {{revise_auto_go}}                # not used by this version: only the owner's own go starts a fix
  kinds: {{revise_kinds}}   # not used by this version
  max_attempts: {{revise_max_attempts}}             # tries per issue; then it waits for Retry on the project's page
  lease_hours: {{revise_lease_hours}}              # not used by this version
  max_usd: {{revise_max_usd}}               # per fix; null = no cap of its own; the loop's maintain.max_usd
                              # applies as well when set (the smaller wins)
  models: {{revise_models}}                  # per-stage overrides, same roles as Settings › Building; {} = default

merge:
  factory_patch: {{merge_factory_patch}}          # not used by this version: merging is a switch on the
                              #   project's page, off by default. With it on, repo-factory merges
                              #   its own fix (squash), one per poll, only for an issue labelled
                              #   bug (its test in the diff) or docs (documents only), CI green,
                              #   up to date with main, at most merge.max_lines; never a change to
                              #   a manifest, a lock file, build or test settings, .github/, an
                              #   agent's or editor's file; never one labelled `hold` or
                              #   `needs-you`, with changes requested, or that anyone else pushed to.
  kinds: {{merge_kinds}}         # of bug | docs (any other kind is never merged)
  max_lines: {{merge_max_lines}}
  dependabot: {{merge_dependabot}}           # not used by this version: Dependabot's PRs are never merged

release:
  on_merge: {{release_on_merge}}             # patch | minor | off, read only when releasing after a merge
                              #   is switched on (a third switch on the project's page, off by
                              #   default). Tag + GitHub release with generated notes.
  prefix: {{release_prefix}}

spend:
  note: {{spend_note}}                    # free text shown in the repo-factory UI next to this repo
