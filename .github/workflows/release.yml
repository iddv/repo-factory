name: release
# A release, on a version tag (vX.Y.Z) pushed by a maintainer. It shares nothing with the pull
# request workflow: its own trigger, no cache. Two jobs:
# - build, with a read-only token: the page, the wheel, the install test against that exact
#   wheel, SHA256SUMS and the release notes, kept as this run's artefact;
# - publish, in the `release` environment (it waits for a maintainer's approval), the only job
#   that may write: it refuses a tag whose commit is not on main, then creates the GitHub
#   release with the build job's files. No third-party action runs while it holds that token.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: the version is the tag's
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/build_ui.py
      - name: the wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.v.outputs.version }}
        run: uv build --wheel
      - run: python3 scripts/ci/install_test.py dist/*.whl
      - name: checksums and notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          cd dist && sha256sum ./*.whl | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS && cd ..
          python3 scripts/ci/release_notes.py "$TAG" > dist/notes.md
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: the tag's commit is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" FETCH_HEAD; then
            echo "the tag's commit $GITHUB_SHA is not on main: no release" >&2
            exit 1
          fi
      - name: the build job's files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name dist --dir dist
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file dist/notes.md --verify-tag
