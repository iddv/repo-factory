name: release
# A release, on a version tag (vX.Y.Z) pushed by a maintainer. It shares nothing with the pull
# request workflow: its own trigger, no cache, and the `release` environment, which waits for a
# maintainer's approval before anything is published. It builds the page and the wheel, runs
# the install test against that exact wheel, writes SHA256SUMS, and creates the GitHub release
# with both files attached.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: the version is the tag's
        id: v
        env:
          TAG: ${{ github.ref_name }}
        run: echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - run: python3 scripts/build_ui.py
      - name: the wheel
        env:
          SETUPTOOLS_SCM_PRETEND_VERSION: ${{ steps.v.outputs.version }}
        run: uv build --wheel
      - run: python3 scripts/ci/install_test.py dist/*.whl
      - name: checksums
        run: cd dist && sha256sum ./*.whl | sed 's| \./| |' > SHA256SUMS && cat SHA256SUMS
      - name: the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 scripts/ci/release_notes.py "$TAG" > notes.md
          gh release create "$TAG" dist/*.whl dist/SHA256SUMS --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" --notes-file notes.md --verify-tag
